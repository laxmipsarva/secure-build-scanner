name: 'Secure Build Scanner'
description: >-
  Flag missing security controls (rate limiting, CAPTCHA, CSRF, bot
  filtering) and injection, CORS, CSP, GraphQL, and API flaws in Express and
  Next.js code. Zero config, no API keys.
author: 'Laxmi Sarva'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'Directory or file to scan, relative to the caller repo checkout'
    required: false
    default: '.'
  format:
    description: 'Output format: text | json (written to the job log) | sarif (written to sarif-file)'
    required: false
    default: 'text'
  sarif-file:
    description: 'Where to write the report when format is sarif, relative to the workspace'
    required: false
    default: 'build-scanner.sarif'
  upload-sarif:
    description: 'When format is sarif and this is "true", upload the report to GitHub Code Scanning (needs security-events: write)'
    required: false
    default: 'true'
  rules:
    description: 'Comma-separated rule IDs to run. Run the CLI `rules` subcommand, or see README.md, for the full list. Empty runs all rules.'
    required: false
    default: ''
  fail-on:
    description: 'Minimum severity that fails the step: critical | high | medium | low | info. Empty means the step never fails on findings.'
    required: false
    default: ''
  list-files:
    description: 'When "true", append the full list of scanned files to the text-format report'
    required: false
    default: 'false'

outputs:
  sarif-file:
    description: 'Path to the SARIF report (set only when format is sarif)'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Resolve action path
      id: paths
      shell: bash
      run: echo "lockfile=$(cd "${{ github.action_path }}" && pwd)/package-lock.json" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ steps.paths.outputs.lockfile }}

    - name: Install build-scanner dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Build build-scanner
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Run scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_FORMAT: ${{ inputs.format }}
        SCAN_RULES: ${{ inputs.rules }}
        SCAN_FAIL_ON: ${{ inputs.fail-on }}
        SCAN_LIST_FILES: ${{ inputs.list-files }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        args=("$SCAN_PATH" --format "$SCAN_FORMAT")

        if [ -n "$SCAN_RULES" ]; then
          args+=(--rules "$SCAN_RULES")
        fi

        if [ -n "$SCAN_FAIL_ON" ]; then
          args+=(--fail-on "$SCAN_FAIL_ON")
        fi

        if [ "$SCAN_LIST_FILES" = "true" ]; then
          args+=(--list-files)
        fi

        # Record the exit code instead of failing here, so a SARIF report is still uploaded
        # when the --fail-on gate trips; the last step re-applies it.
        set +e
        if [ "$SCAN_FORMAT" = "sarif" ]; then
          node "${{ github.action_path }}/dist/cli.js" "${args[@]}" > "$SARIF_FILE"
          code=$?
          echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
          echo "SARIF report written to $SARIF_FILE"
        else
          node "${{ github.action_path }}/dist/cli.js" "${args[@]}"
          code=$?
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to Code Scanning
      if: inputs.format == 'sarif' && inputs.upload-sarif == 'true' && (steps.scan.outputs.exit-code == '0' || steps.scan.outputs.exit-code == '1')
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: build-scanner

    - name: Apply fail-on gate
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: exit "$EXIT_CODE"
