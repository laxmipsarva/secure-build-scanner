name: 'Secure Build Scanner'
description: >-
  Scan source code for SQL/NoSQL injection, GraphQL, CORS, CSP, and CSRF
  vulnerabilities directly in CI/CD.
author: 'Laxmi Sarva'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'Directory or file to scan, relative to the caller repo checkout'
    required: false
    default: '.'
  format:
    description: 'Output format written to the job log: text | json'
    required: false
    default: 'text'
  rules:
    description: 'Comma-separated rule IDs to run. Run the CLI `rules` subcommand, or see README.md, for the full list. Empty runs all rules.'
    required: false
    default: ''
  fail-on:
    description: 'Minimum severity that fails the step: critical | high | medium | low | info. Empty means the step never fails on findings.'
    required: false
    default: ''
  list-files:
    description: 'When "true", append the full list of scanned files to the text-format report'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Resolve action path
      id: paths
      shell: bash
      run: echo "lockfile=$(cd "${{ github.action_path }}" && pwd)/package-lock.json" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ steps.paths.outputs.lockfile }}

    - name: Install build-scanner dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Build build-scanner
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Run scan
      shell: bash
      run: |
        args=("${{ inputs.path }}" --format "${{ inputs.format }}")

        if [ -n "${{ inputs.rules }}" ]; then
          args+=(--rules "${{ inputs.rules }}")
        fi

        if [ -n "${{ inputs.fail-on }}" ]; then
          args+=(--fail-on "${{ inputs.fail-on }}")
        fi

        if [ "${{ inputs.list-files }}" = "true" ]; then
          args+=(--list-files)
        fi

        node "${{ github.action_path }}/dist/cli.js" "${args[@]}"
